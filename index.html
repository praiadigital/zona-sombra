<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zona Sombra — Sol & Sombra por Praia | Praia Digital</title><meta name="description" content="Melhores horários de sol e sombra na faixa de areia por praia do litoral paulista, por época do ano."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#fff4e0,#e8f4fa);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #e0a02022}h1{color:#b07d10;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}select{width:100%;padding:.6rem;border:2px solid #f0e0bc;border-radius:10px;font-size:1rem}table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:1rem}td,th{padding:.45rem;border-bottom:1px solid #f2e6c8;text-align:left}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#b07d10;margin:0 .5rem;text-decoration:none}.sol{color:#e0a020}.som{color:#4a6fa5}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/sol-e-sombra">Sol e Sombra</a> · <a href="https://praia.digital/clima-litoral">Clima Litoral</a> · <a href="https://praia.digital/mare-hoje">Maré Hoje</a></nav><div class="card"><h1>⛱️ Zona Sombra</h1><p>Qual horário a sombra chega na areia? Planeje o dia do hóspede (ou o seu).</p><label>Praia</label><select id="p" onchange="render()"><option value='{"n":"Gonzaga (Santos)","o":"SE","s":15}'>Gonzaga — Santos</option><option value='{"n":"Enseada (Guarujá)","o":"SE","s":15}'>Enseada — Guarujá</option><option value='{"n":"Maresias (São Sebastião)","o":"S","s":14}'>Maresias — São Sebastião</option><option value='{"n":"Itamambuca (Ubatuba)","o":"E","s":16}'>Itamambuca — Ubatuba</option><option value='{"n":"Boqueirão (Praia Grande)","o":"S","s":15}'>Boqueirão — Praia Grande</option><option value='{"n":"Perequê (Ilhabela)","o":"W","s":17}'>Perequê — Ilhabela</option></select><div id="tbl"></div></div><script>function render(){const p=JSON.parse(document.getElementById('p').value);const rows=[['06h–09h','☀️ sol pleno'],['09h–12h','☀️ sol forte (FPS alto!)'],['12h–'+p.s+'h','☀️ sol de pico'],[p.s+'h–'+(p.s+1)+'h','⛅ sombra chega na faixa'],[(p.s+1)+'h–18h','🌥️ sombra/pôr do sol']];document.getElementById('tbl').innerHTML=`<p style="margin-top:.6rem"><b>${p.n}</b> — orientação ${p.o}</p><table><tr><th>Horário</th><th>Condição na areia</th></tr>`+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')+`</table><p style="margin-top:.8rem;font-size:.85rem">💡 Envie junto com a maré do dia pelo <a href="https://praia.digital/mare-hoje">Maré Hoje</a> e monte o roteiro completo no <a href="https://praia.digital/roteiro-litoral">Roteiro Litoral</a>.</p>`}render()</script></body></html>
